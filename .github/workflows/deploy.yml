name: Deploy HistoryReader 3.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Restore website files
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet brotli
          python - <<'PY'
          from pathlib import Path
          import brotli

          site = Path("_site")
          site.mkdir(exist_ok=True)
          source = Path("index.html.br")
          if not source.is_file():
              raise SystemExit("Missing compressed index.html.br")
          (site / "index.html").write_bytes(brotli.decompress(source.read_bytes()))
          for name in ("ai-worker.js", "tts-worker.js"):
              path = Path(name)
              if not path.is_file():
                  raise SystemExit(f"Missing required worker: {name}")
              (site / name).write_bytes(path.read_bytes())
          (site / ".nojekyll").touch()
          print("Website restored:", sorted(p.name for p in site.iterdir()))
          PY
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
