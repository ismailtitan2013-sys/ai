name: Deploy HistoryReader 3.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Restore website files
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --quiet brotli
          python - <<'PY'
          from pathlib import Path
          import brotli
          site = Path('_site')
          site.mkdir(exist_ok=True)
          source = Path('index.html.br')
          if not source.exists():
              raise SystemExit('Missing index.html.br')
          (site / 'index.html').write_bytes(brotli.decompress(source.read_bytes()))
          for name in ('ai-worker.js', 'tts-worker.js', 'manifest.webmanifest',
                       'service-worker.js', 'icon-192.png', 'icon-512.png'):
              src = Path(name)
              if not src.is_file():
                  raise SystemExit(f'Missing website asset: {name}')
              (site / name).write_bytes(src.read_bytes())
          (site / '.nojekyll').touch()
          print('Restored all website assets.')
          PY
      - name: Patch reader voice playback
        shell: bash
        run: python scripts/patch_reader.py
      - name: Validate website and JavaScript
        shell: bash
        run: |
          test -s _site/index.html
          test -s _site/ai-worker.js
          test -s _site/tts-worker.js
          test -s _site/manifest.webmanifest
          test -s _site/service-worker.js
          test -s _site/icon-192.png
          test -s _site/icon-512.png
          node --input-type=module --check < _site/ai-worker.js
          node --input-type=module --check < _site/tts-worker.js
          node --input-type=module --check < _site/service-worker.js
          test -s /tmp/history-reader-inline.js
          node --check /tmp/history-reader-inline.js
          grep -q "SpeechSynthesisUtterance" _site/index.html
          grep -q "speechSynthesis.pause()" _site/index.html
          grep -q "speechSynthesis.resume()" _site/index.html
          grep -q 'id="voiceSelect"' _site/index.html
          grep -q "AI-рассказ" _site/index.html
          ! grep -q "Загрузить голос · ≈51 МБ" _site/index.html
          ! grep -q "tts-worker.js?v=" _site/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
